<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .font-main { font-family: system-ui, -apple-system, sans-serif; }
      
      .title { font-size: 36px; font-weight: 800; fill: #FFFFFF; letter-spacing: -1px; }
      .subtitle { font-size: 15px; font-weight: 400; fill: #94A3B8; }
      .copyright { font-size: 12px; font-weight: 400; fill: #475569; }
      .label { font-size: 11px; font-weight: 700; fill: #00FFCC; letter-spacing: 3px; text-transform: uppercase; }
      
      @keyframes slowSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes slowSpinReverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00FFCC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="20"/>
  <rect width="1200" height="300" fill="url(#centerGlow)" rx="20"/>

  <g class="font-main">

    <!-- ========================================== -->
    <!-- LEFT SIDE: Concentric Rings (Decorative)   -->
    <!-- ========================================== -->
    <g transform="translate(180, 150)">
      <!-- Outer ring - slow spin -->
      <circle cx="0" cy="0" r="110" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 12" style="animation: slowSpin 40s linear infinite; transform-origin: 0px 0px;"/>
      
      <!-- Middle ring - reverse spin -->
      <circle cx="0" cy="0" r="80" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="8 16" style="animation: slowSpinReverse 30s linear infinite; transform-origin: 0px 0px;"/>
      
      <!-- Inner ring - subtle pulse -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="#00FFCC" stroke-width="1" opacity="0.2" style="animation: pulse 4s infinite;"/>
      
      <!-- Center dot -->
      <circle cx="0" cy="0" r="4" fill="#00FFCC" opacity="0.6"/>
      
      <!-- Small accent dots on rings -->
      <circle cx="0" cy="-110" r="3" fill="#00FFCC" opacity="0.5" style="animation: slowSpin 40s linear infinite; transform-origin: 0px 0px;"/>
      <circle cx="80" cy="0" r="2.5" fill="#3B82F6" opacity="0.4" style="animation: slowSpinReverse 30s linear infinite; transform-origin: 0px 0px;"/>
      <circle cx="-50" cy="0" r="2" fill="#EC4899" opacity="0.3" style="animation: slowSpin 25s linear infinite; transform-origin: 0px 0px;"/>
    </g>

    <!-- ========================================== -->
    <!-- RIGHT SIDE: Geometric Shapes (Decorative)  -->
    <!-- ========================================== -->
    <g transform="translate(1020, 150)">
      <!-- Triangle outline -->
      <polygon points="0,-70 60,35 -60,35" fill="none" stroke="#1E293B" stroke-width="1.5" style="animation: float 6s infinite ease-in-out;"/>
      
      <!-- Inner triangle -->
      <polygon points="0,-40 35,20 -35,20" fill="none" stroke="#334155" stroke-width="1" style="animation: float 5s infinite ease-in-out reverse;"/>
      
      <!-- Small circle accent -->
      <circle cx="0" cy="-70" r="3" fill="#00FFCC" opacity="0.5" style="animation: pulse 3s infinite;"/>
      <circle cx="60" cy="35" r="2.5" fill="#3B82F6" opacity="0.4"/>
      <circle cx="-60" cy="35" r="2.5" fill="#EC4899" opacity="0.3"/>
      
      <!-- Horizontal line accents -->
      <line x1="-90" y1="80" x2="-30" y2="80" stroke="#334155" stroke-width="1"/>
      <line x1="30" y1="80" x2="90" y2="80" stroke="#334155" stroke-width="1"/>
      <circle cx="-30" cy="80" r="2" fill="#00FFCC" opacity="0.4"/>
      <circle cx="30" cy="80" r="2" fill="#00FFCC" opacity="0.4"/>
    </g>

    <!-- ========================================== -->
    <!-- CENTER: Typography & Content               -->
    <!-- ========================================== -->
    <g transform="translate(600, 90)" text-anchor="middle">
      
      <!-- Small label on top -->
      <text x="0" y="0" class="label">Connect</text>
      
      <!-- Main heading -->
      <text x="0" y="45" class="title">Let's build together.</text>
      
      <!-- Subtitle -->
      <text x="0" y="75" class="subtitle">Open for collaborations, freelance projects, and tech conversations.</text>
      
      <!-- Minimal divider -->
      <line x1="-60" y1="100" x2="60" y2="100" stroke="#334155" stroke-width="1"/>
      <line x1="-15" y1="100" x2="15" y2="100" stroke="#00FFCC" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Copyright -->
      <text x="0" y="130" class="copyright">© 2025 Sajitha Heshan — Designed &amp; Built with AI</text>
    </g>

  </g>
</svg>
