<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <style>
      @keyframes panGrid { 0% { transform: translateY(0); } 100% { transform: translateY(40px); } }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
      
      .title { font-family: 'Arial Black', sans-serif; font-size: 75px; fill: #FFFFFF; letter-spacing: -2px; }
      .tag { font-family: monospace; font-size: 14px; fill: #00E5FF; }
    </style>
    <!-- Grid Pattern -->
    <pattern id="movingGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1000" height="350" fill="#0D0E15" rx="15"/>

  <!-- Animated Moving Background Grid -->
  <rect width="1000" height="400" fill="url(#movingGrid)" style="animation: panGrid 3s linear infinite;"/>

  <!-- Floating 3D Geometric Graphics -->
  <g style="animation: floatY 6s infinite ease-in-out;" transform="translate(150, 150)">
    <polygon points="50,0 100,25 100,75 50,100 0,75 0,25" fill="none" stroke="#00E5FF" stroke-width="3" style="animation: spin 15s linear infinite; transform-origin: 50px 50px;"/>
  </g>

  <g style="animation: floatY 8s infinite ease-in-out reverse;" transform="translate(800, 80)">
    <polygon points="40,0 80,20 80,60 40,80 0,60 0,20" fill="none" stroke="#FF0055" stroke-width="3" opacity="0.6" style="animation: spin 10s linear infinite reverse; transform-origin: 40px 40px;"/>
  </g>

  <!-- Typography -->
  <g transform="translate(500, 180)" text-anchor="middle">
    <rect x="-80" y="-80" width="160" height="24" fill="#00E5FF" fill-opacity="0.15" rx="12"/>
    <text x="0" y="-63" class="tag">SYS.ARCHITECT</text>
    <text x="0" y="20" class="title">SAJITHA</text>
    <text x="0" y="90" class="title" fill="none" stroke="#FFFFFF" stroke-width="2">HESHAN</text>
  </g>
</svg>
