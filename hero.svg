<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&amp;family=Space+Grotesk:wght@700&amp;display=swap');

      /* Text Animations */
      @keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
      
      /* Yellow Highlight Motion */
      @keyframes drawHighlight { 0% { stroke-dashoffset: 400; opacity: 0; } 10% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
      
      /* 3D Isometric Floating Animations */
      @keyframes float3D_1 { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-25px) rotate(2deg); } }
      @keyframes float3D_2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(20px); } }
      @keyframes float3D_3 { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-15px) scale(1.05); } }
      
      /* Glowing Data Lines Animation */
      @keyframes dashMove { 0% { stroke-dashoffset: 100; } 100% { stroke-dashoffset: 0; } }

      /* Styling */
      .badge-text { font-family: 'Space Grotesk', sans-serif; font-size: 14px; fill: #00FFCC; letter-spacing: 2px; }
      .headline { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 60px; fill: #FFFFFF; letter-spacing: -2px; opacity: 0; animation: fadeUp 0.8s ease-out 0.2s forwards; }
      .desc-text { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 18px; fill: #94A3B8; line-height: 1.6; opacity: 0; animation: fadeUp 0.8s ease-out 0.5s forwards; }
      
      .yellow-marker {
        stroke: #FFD54F; stroke-width: 28; stroke-linecap: round; fill: none;
        stroke-dasharray: 400; stroke-dashoffset: 400; opacity: 0;
        animation: drawHighlight 1.2s cubic-bezier(0.7, 0, 0.3, 1) 1s forwards;
      }

      /* 3D Classes */
      .cube-1 { animation: float3D_1 6s infinite ease-in-out; }
      .cube-2 { animation: float3D_2 8s infinite ease-in-out; }
      .ui-card { animation: float3D_3 7s infinite ease-in-out; filter: drop-shadow(0 20px 30px rgba(0,255,204,0.1)); }
    </style>

    <!-- Ambient Glowing Lights -->
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0055FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0055FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00FFCC" stop-opacity="0"/>
    </radialGradient>

    <!-- Isometric Background Grid -->
    <pattern id="isoGrid" width="60" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 15 L30 30 L0 15 Z" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Base Dark Background -->
  <rect width="1200" height="550" fill="#0D0E15" rx="20" />
  
  <!-- Glowing Ambient Backgrounds -->
  <circle cx="900" cy="250" r="400" fill="url(#glowBlue)" />
  <circle cx="300" cy="400" r="300" fill="url(#glowCyan)" />

  <!-- Animated Isometric Grid -->
  <rect width="1200" height="550" fill="url(#isoGrid)" rx="20" />

  <!-- ========================================== -->
  <!-- RIGHT SIDE: 3D MOTION GRAPHICS & UI CARDS  -->
  <!-- ========================================== -->

  <g transform="translate(650, 50)">
    
    <!-- Animated Data Connection Lines -->
    <path d="M 150 150 L 300 250 L 450 150" fill="none" stroke="#00FFCC" stroke-width="2" stroke-dasharray="10 10" opacity="0.5" style="animation: dashMove 2s linear infinite;"/>
    <path d="M 300 250 L 300 450" fill="none" stroke="#FF007A" stroke-width="2" stroke-dasharray="10 10" opacity="0.5" style="animation: dashMove 2s linear infinite reverse;"/>

    <!-- 3D Isometric Cube 1 (Cyan) -->
    <g class="cube-1" transform="translate(100, 80)">
      <polygon points="50,0 100,25 50,50 0,25" fill="#00FFCC" opacity="0.9"/>
      <polygon points="0,25 50,50 50,100 0,75" fill="#00B38F" opacity="1"/>
      <polygon points="100,25 50,50 50,100 100,75" fill="#006652" opacity="1"/>
    </g>

    <!-- 3D Isometric Cube 2 (Pink/Purple) -->
    <g class="cube-2" transform="translate(400, 150)">
      <polygon points="40,0 80,20 40,40 0,20" fill="#FF007A" opacity="0.9"/>
      <polygon points="0,20 40,40 40,80 0,60" fill="#B30056" opacity="1"/>
      <polygon points="80,20 40,40 40,80 80,60" fill="#660031" opacity="1"/>
    </g>

    <!-- Floating Graphic UI Card (Glassmorphism Bento Box) -->
    <g class="ui-card" transform="translate(180, 200)">
      <!-- Card Base -->
      <rect width="280" height="180" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
      
      <!-- UI Elements inside the Card -->
      <rect x="25" y="25" width="40" height="40" rx="10" fill="#00FFCC" opacity="0.2"/>
      <circle cx="45" cy="45" r="10" fill="#00FFCC"/>
      
      <rect x="85" y="30" width="120" height="10" rx="5" fill="#FFFFFF" opacity="0.8"/>
      <rect x="85" y="50" width="160" height="8" rx="4" fill="#FFFFFF" opacity="0.3"/>

      <!-- Data Graph inside Card -->
      <path d="M 25 140 Q 60 100 100 120 T 170 80 T 250 100" fill="none" stroke="#FF007A" stroke-width="4" stroke-linecap="round"/>
      <circle cx="250" cy="100" r="6" fill="#FF007A"/>
      
      <!-- Code Block UI -->
      <rect x="25" y="80" width="10" height="60" rx="5" fill="#00FFCC"/>
      <rect x="45" y="100" width="10" height="40" rx="5" fill="#00FFCC" opacity="0.6"/>
      <rect x="65" y="120" width="10" height="20" rx="5" fill="#00FFCC" opacity="0.3"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- LEFT SIDE: HEAVY TEXT, HIGHLIGHT & BADGES  -->
  <!-- ========================================== -->
  <g transform="translate(70, 100)">
    
    <!-- Top Cyber Badge -->
    <g style="animation: fadeUp 0.8s ease-out forwards;">
      <rect x="0" y="0" width="230" height="32" rx="16" fill="#00FFCC" fill-opacity="0.1" stroke="#00FFCC" stroke-width="1"/>
      <circle cx="20" cy="16" r="4" fill="#00FFCC" />
      <text x="35" y="21" class="badge-text">SYSTEMS ARCHITECT</text>
    </g>

    <!-- Heavy Headline -->
    <!-- Yellow Marker (Drawn behind the text) -->
    <path d="M -5 125 Q 150 120 330 125" class="yellow-marker" />
    
    <text x="0" y="80" class="headline">Engineering <tspan fill="#00FFCC">next-gen</tspan></text>
    <text x="0" y="145" class="headline"><tspan fill="#111">digital realities.</tspan></text>

    <!-- Heavy Description (Paragraph) -->
    <text x="0" y="195" class="desc-text">I am not just a developer; I am an Architect of Ideas. By</text>
    <text x="0" y="225" class="desc-text">bypassing traditional syntax and leveraging <tspan fill="#FFFFFF" font-weight="600">AI capabilities</tspan>,</text>
    <text x="0" y="255" class="desc-text">I design scalable logic, pixel-perfect UI/UX interfaces,</text>
    <text x="0" y="285" class="desc-text">and high-performance digital ecosystems from scratch.</text>

    <!-- Real Animated Badges Section -->
    <text x="0" y="355" class="badge-text" fill="#FFFFFF" opacity="0.6">CORE ARSENAL // LIVE STACK</text>
    
    <!-- Real Raw SVG Logos (Immune to GitHub Blocking) -->
    <g transform="translate(0, 380)" style="animation: fadeUp 1s ease-out 0.8s forwards; opacity: 0;">
      
      <!-- Figma Logo (Native Path) -->
      <g transform="translate(0, 0)">
        <rect width="50" height="50" rx="12" fill="#1A1C23" stroke="#333" stroke-width="1"/>
        <g transform="translate(15, 12) scale(0.8)">
          <path d="M16 16c4.4 0 8-3.6 8-8s-3.6-8-8-8-8 3.6-8 8 3.6 8 8 8z" fill="#F24E1E"/>
          <path d="M8 16c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8-3.6-8-8-8z" fill="#A259FF"/>
          <path d="M16 32c4.4 0 8-3.6 8-8s-3.6-8-8-8h-8v16h8z" fill="#1ABCFE"/>
          <path d="M8 32c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8v-8H8z" fill="#0ACF83"/>
          <path d="M16 0h8v16h-8V0z" fill="#FF7262"/>
        </g>
      </g>

      <!-- React Logo (Native Path) -->
      <g transform="translate(65, 0)">
        <rect width="50" height="50" rx="12" fill="#1A1C23" stroke="#333" stroke-width="1"/>
        <g transform="translate(25, 25) scale(0.9)">
          <circle cx="0" cy="0" r="3" fill="#61DAFB"/>
          <ellipse rx="13" ry="5" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(30)"/>
          <ellipse rx="13" ry="5" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(90)"/>
          <ellipse rx="13" ry="5" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(150)"/>
        </g>
      </g>

      <!-- JS Logo (Native Path) -->
      <g transform="translate(130, 0)">
        <rect width="50" height="50" rx="12" fill="#1A1C23" stroke="#333" stroke-width="1"/>
        <g transform="translate(15, 15) scale(0.7)">
          <rect x="0" y="0" width="30" height="30" fill="#F7DF1E"/>
          <path d="M22 25c-1 1-2.5 1.5-4 1.5-2.5 0-4-1-4.5-2l2.5-1.5c.5.5 1.5 1 2 1 1 0 1.5-.5 1.5-1 0-1.5-4-1.5-4-3.5 0-1.5 1.5-2.5 3.5-2.5 1.5 0 2.5.5 3.5 1.5l-2 1.5c-.5-.5-1-1-1.5-1-.5 0-1 .5-1 1 0 1.5 4 1.5 4 3.5 0 1.5-1.5 2.5-2.5 2.5zM11 26.5c-1.5 0-2.5-.5-3.5-1.5l2-1.5c.5.5 1.5 1 2 1 .5 0 1-.5 1-2V15h3v7.5c0 2.5-1.5 4-4.5 4z" fill="#000000"/>
        </g>
      </g>

      <!-- OpenAI / AI Symbol -->
      <g transform="translate(195, 0)">
        <rect width="50" height="50" rx="12" fill="#1A1C23" stroke="#333" stroke-width="1"/>
        <g transform="translate(15, 15) scale(1)">
          <circle cx="10" cy="10" r="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
          <circle cx="10" cy="10" r="3" fill="#FFFFFF"/>
          <path d="M10 2 L10 5 M10 15 L10 18 M2 10 L5 10 M15 10 L18 10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>

    </g>
  </g>
</svg>
