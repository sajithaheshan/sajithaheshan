<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- 100% GITHUB SAFE CSS -->
    <style>
      .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      
      /* Typography */
      .main-title { font-size: 70px; font-weight: 900; fill: #FFFFFF; letter-spacing: -2px; }
      .sub-title { font-size: 20px; font-weight: 400; fill: #A1A1AA; letter-spacing: 1px; }
      .highlight { fill: #EAB308; } /* Cinematic Gold */
      
      .card-title { font-size: 16px; font-weight: 700; fill: #FFFFFF; letter-spacing: 2px; }
      .card-desc { font-size: 18px; font-weight: 400; fill: #94A3B8; line-height: 1.6; }
      
      /* Glassmorphism Card Style */
      .bento-card { 
        fill: rgba(20, 20, 25, 0.8); 
        stroke: rgba(255, 255, 255, 0.1); 
        stroke-width: 1.5px; 
        rx: 24px; 
      }

      /* Animations */
      @keyframes spin { 100% { transform: rotate(360deg); } }
      @keyframes spinReverse { 100% { transform: rotate(-360deg); } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.05); } }
      
      @keyframes floatUp { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes floatIcon1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
      @keyframes floatIcon2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
      
      @keyframes drawGraph { 0% { stroke-dashoffset: 400; } 100% { stroke-dashoffset: 0; } }

      /* Animation Delays for smooth loading */
      .anim-1 { animation: floatUp 1s ease-out forwards; }
      .anim-2 { animation: floatUp 1s ease-out 0.2s forwards; opacity: 0; }
      .anim-3 { animation: floatUp 1s ease-out 0.4s forwards; opacity: 0; }
    </style>

    <!-- Cinematic Gold Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#EAB308" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Pitch Black Base Canvas -->
  <rect width="1200" height="700" fill="#050505" rx="20"/>

  <!-- ========================================== -->
  <!-- TOP SECTION: CINEMATIC CENTER HEADER       -->
  <!-- ========================================== -->
  <g transform="translate(600, 180)">
    
    <!-- Pulsing Gold Aura -->
    <circle cx="0" cy="0" r="450" fill="url(#goldGlow)" style="animation: pulseGlow 6s infinite ease-in-out;"/>
    
    <!-- Rotating Tech Rings (Architect Vibe) -->
    <circle cx="0" cy="0" r="300" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="10 40" stroke-opacity="0.1" style="animation: spin 40s linear infinite;"/>
    <circle cx="0" cy="0" r="260" fill="none" stroke="#EAB308" stroke-width="2" stroke-dasharray="4 20" stroke-opacity="0.4" style="animation: spinReverse 30s linear infinite;"/>
    <circle cx="0" cy="0" r="220" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.05"/>
  </g>

  <!-- Header Text -->
  <g class="font-sans anim-1" transform="translate(600, 120)" text-anchor="middle">
    <!-- Cyber Badge -->
    <rect x="-90" y="-40" width="180" height="30" rx="15" fill="#EAB308" fill-opacity="0.1" stroke="#EAB308" stroke-width="1"/>
    <circle cx="-65" cy="-25" r="4" fill="#EAB308" style="animation: pulseGlow 2s infinite;"/>
    <text x="10" y="-20" font-size="12px" font-weight="700" fill="#EAB308" letter-spacing="2px">SYSTEM ONLINE</text>

    <!-- Main Title -->
    <text x="0" y="40" class="main-title">SAJITHA HESHAN</text>
    <text x="0" y="110" class="main-title">THE <tspan class="highlight">ARCHITECT.</tspan></text>
    <text x="0" y="160" class="sub-title">Designing aesthetic UI/UX &amp; building scalable AI-driven ecosystems.</text>
  </g>


  <!-- ========================================== -->
  <!-- BOTTOM SECTION: THE BENTO UI GRID          -->
  <!-- ========================================== -->
  
  <g class="font-sans" transform="translate(50, 350)">
    
    <!-- CARD 1: The Vision (Left Heavy Text Box) -->
    <g class="anim-2">
      <rect x="0" y="0" width="480" height="300" class="bento-card"/>
      <g transform="translate(40, 50)">
        <text x="0" y="0" class="card-title">01 // THE VISION</text>
        <rect x="0" y="20" width="40" height="4" rx="2" fill="#EAB308"/>
        
        <text x="0" y="80" class="card-desc">I bridge the gap between high-end</text>
        <text x="0" y="115" class="card-desc">visual design and complex <tspan fill="#FFFFFF" font-weight="700">AI-driven</tspan></text>
        <text x="0" y="150" class="card-desc">development. By stepping outside</text>
        <text x="0" y="185" class="card-desc">the traditional database, I architect</text>
        <text x="0" y="220" class="card-desc">scalable, modern digital products</text>
        <text x="0" y="255" class="card-desc">that prioritize systemic efficiency.</text>
      </g>
    </g>

    <!-- CARD 2: System Logic (Middle Animated Graphic) -->
    <g class="anim-3" transform="translate(510, 0)">
      <rect x="0" y="0" width="350" height="300" class="bento-card"/>
      <g transform="translate(40, 50)">
        <text x="0" y="0" class="card-title">02 // SYSTEM LOGIC</text>
        
        <!-- Animated UI Graph -->
        <g transform="translate(0, 50)">
          <!-- Grid Lines -->
          <path d="M0 40 L270 40 M0 100 L270 100 M0 160 L270 160" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
          
          <!-- Animated Gold Graph Line -->
          <path d="M0 160 Q 60 40 130 90 T 260 20" fill="none" stroke="#EAB308" stroke-width="4" stroke-linecap="round" stroke-dasharray="400" stroke-dashoffset="400" style="animation: drawGraph 2s cubic-bezier(0.7, 0, 0.3, 1) infinite alternate;"/>
          
          <!-- Glowing Node -->
          <circle cx="260" cy="20" r="6" fill="#FFFFFF" style="animation: floatIcon1 2s infinite alternate;"/>
          <circle cx="260" cy="20" r="14" fill="#EAB308" opacity="0.3" style="animation: floatIcon1 2s infinite alternate;"/>
        </g>
      </g>
    </g>

    <!-- CARD 3: Core Arsenal (Right Floating Icons) -->
    <g class="anim-2" transform="translate(890, 0)">
      <rect x="0" y="0" width="210" height="300" class="bento-card"/>
      <g transform="translate(35, 50)">
        <text x="0" y="0" class="card-title">03 // STACK</text>

        <!-- Floating Figma Logo -->
        <g transform="translate(10, 40)" style="animation: floatIcon1 4s infinite ease-in-out;">
          <rect width="50" height="50" rx="14" fill="#18181B" stroke="#333" stroke-width="1"/>
          <g transform="translate(15, 12) scale(0.8)">
            <path d="M16 16c4.4 0 8-3.6 8-8s-3.6-8-8-8-8 3.6-8 8 3.6 8 8 8z" fill="#F24E1E"/>
            <path d="M8 16c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8-3.6-8-8-8z" fill="#A259FF"/>
            <path d="M16 32c4.4 0 8-3.6 8-8s-3.6-8-8-8h-8v16h8z" fill="#1ABCFE"/>
            <path d="M8 32c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8v-8H8z" fill="#0ACF83"/>
            <path d="M16 0h8v16h-8V0z" fill="#FF7262"/>
          </g>
        </g>

        <!-- Floating React Logo -->
        <g transform="translate(80, 80)" style="animation: floatIcon2 5s infinite ease-in-out;">
          <rect width="50" height="50" rx="14" fill="#18181B" stroke="#333" stroke-width="1"/>
          <g transform="translate(25, 25) scale(0.9)">
            <circle cx="0" cy="0" r="3" fill="#61DAFB"/>
            <ellipse rx="13" ry="5" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(30)"/>
            <ellipse rx="13" ry="5" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(90)"/>
            <ellipse rx="13" ry="5" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(150)"/>
          </g>
        </g>

        <!-- Floating JS Logo -->
        <g transform="translate(10, 140)" style="animation: floatIcon1 6s infinite ease-in-out;">
          <rect width="50" height="50" rx="14" fill="#18181B" stroke="#333" stroke-width="1"/>
          <g transform="translate(15, 15) scale(0.7)">
            <rect width="30" height="30" fill="#F7DF1E"/>
            <path d="M22 25c-1 1-2.5 1.5-4 1.5-2.5 0-4-1-4.5-2l2.5-1.5c.5.5 1.5 1 2 1 1 0 1.5-.5 1.5-1 0-1.5-4-1.5-4-3.5 0-1.5 1.5-2.5 3.5-2.5 1.5 0 2.5.5 3.5 1.5l-2 1.5c-.5-.5-1-1-1.5-1-.5 0-1 .5-1 1 0 1.5 4 1.5 4 3.5 0 1.5-1.5 2.5-2.5 2.5zM11 26.5c-1.5 0-2.5-.5-3.5-1.5l2-1.5c.5.5 1.5 1 2 1 .5 0 1-.5 1-2V15h3v7.5c0 2.5-1.5 4-4.5 4z" fill="#000000"/>
          </g>
        </g>

      </g>
    </g>
  </g>
</svg>
