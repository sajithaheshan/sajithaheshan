<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="100%" height="100%">
  <defs>
    <style>
      .font-main { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif; }
      .card { fill: #FFFFFF; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.05)); rx: 24px; stroke: #E2E8F0; stroke-width: 1px; }
      .headline { font-size: 55px; font-weight: 800; fill: #0F172A; letter-spacing: -1.5px; }
      .desc { font-size: 18px; font-weight: 400; fill: #64748B; line-height: 1.6; }
      
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes drawLine { 0% { stroke-dashoffset: 300; } 100% { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <!-- Light Gray Background -->
  <rect width="1200" height="550" fill="#F8FAFC" rx="20"/>

  <g class="font-main">
    
    <!-- CARD 1: Main Info (Left) -->
    <g transform="translate(40, 40)">
      <rect width="700" height="470" class="card"/>
      <g transform="translate(50, 80)">
        <rect width="130" height="30" rx="15" fill="#10B981" fill-opacity="0.1"/>
        <text x="15" y="20" font-size="13px" font-weight="700" fill="#10B981">CREATOR &amp; DEV</text>
        
        <text x="0" y="90" class="headline">Building <tspan fill="#3B82F6">modern</tspan></text>
        <text x="0" y="160" class="headline">digital products.</text>
        
        <text x="0" y="220" class="desc">I am Sajitha Heshan. I architect AI-driven systems</text>
        <text x="0" y="255" class="desc">and design pixel-perfect user interfaces, bridging</text>
        <text x="0" y="290" class="desc">the gap between human creativity and code.</text>
      </g>
    </g>

    <!-- CARD 2: 3D Animated Graphic (Top Right) -->
    <g transform="translate(760, 40)">
      <rect width="400" height="225" class="card"/>
      <text x="30" y="40" font-size="14px" font-weight="700" fill="#94A3B8">SYSTEM LOGIC</text>
      
      <!-- Animated UI Graph inside Card 2 -->
      <g transform="translate(40, 100)">
        <path d="M0 80 Q 80 10 160 60 T 320 20" fill="none" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" stroke-dasharray="300" stroke-dashoffset="300" style="animation: drawLine 2s forwards infinite alternate;"/>
        <circle cx="320" cy="20" r="8" fill="#3B82F6" style="animation: float 2s infinite;"/>
      </g>
    </g>

    <!-- CARD 3: Tech Stack (Bottom Right) -->
    <g transform="translate(760, 285)">
      <rect width="400" height="225" class="card"/>
      <text x="30" y="40" font-size="14px" font-weight="700" fill="#94A3B8">CORE ARSENAL</text>
      
      <!-- Badges -->
      <g transform="translate(50, 100)">
        <!-- Figma -->
        <rect x="0" y="0" width="60" height="60" rx="16" fill="#F8FAFC" stroke="#E2E8F0" style="animation: float 3s infinite;"/>
        <circle cx="30" cy="30" r="15" fill="#F24E1E"/>
        
        <!-- React -->
        <rect x="80" y="0" width="60" height="60" rx="16" fill="#F8FAFC" stroke="#E2E8F0" style="animation: float 4s infinite reverse;"/>
        <circle cx="110" cy="30" r="15" fill="#61DAFB"/>
        
        <!-- AI/OpenAI -->
        <rect x="160" y="0" width="60" height="60" rx="16" fill="#F8FAFC" stroke="#E2E8F0" style="animation: float 3.5s infinite;"/>
        <circle cx="190" cy="30" r="15" fill="#10B981"/>
      </g>
    </g>

  </g>
</svg>
