<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <style>
      .name { font-family: system-ui, -apple-system, sans-serif; font-size: 55px; font-weight: 900; fill: #FFFFFF; letter-spacing: -1px; }
      .role { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #00FFCC; letter-spacing: 2px; }
      .quote { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-style: italic; fill: #D1D5DB; font-weight: 400; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .card-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #94A3B8; }
      
      @keyframes dpSpin { 100% { transform: rotate(360deg); } }
      @keyframes cardFloat1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes cardFloat2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>

    <!-- The Animated Waving Bottom Path -->
    <clipPath id="waveClip">
      <path d="M0,0 L1200,0 L1200,330 C800,430 400,230 0,330 Z">
        <animate attributeName="d" 
          values="M0,0 L1200,0 L1200,330 C800,430 400,230 0,330 Z;
                  M0,0 L1200,0 L1200,370 C800,270 400,470 0,370 Z;
                  M0,0 L1200,0 L1200,330 C800,430 400,230 0,330 Z" 
          dur="8s" repeatCount="indefinite" />
      </path>
    </clipPath>

    <!-- DP Circular Clip -->
    <clipPath id="dpClip">
      <circle cx="150" cy="200" r="80" />
    </clipPath>

    <!-- Dark Gradient for Text Legibility -->
    <linearGradient id="darkOverlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- ========================================== -->
  <!-- BACKGROUND IMAGE & WAVING MASK             -->
  <!-- ========================================== -->
  <g clip-path="url(#waveClip)">
    <!-- High-Res Background Image -->
    <image href="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&amp;w=2000&amp;auto=format&amp;fit=crop" width="1200" height="500" preserveAspectRatio="xMidYMid slice" />
    
    <!-- Dark Gradient Overlay so text pops out clearly -->
    <rect width="1200" height="500" fill="url(#darkOverlay)" />
    
    <!-- Cyan Color Tint -->
    <rect width="1200" height="500" fill="#00FFCC" opacity="0.1" />
  </g>

  <!-- ========================================== -->
  <!-- LEFT: GITHUB DP & ANIMATED RING            -->
  <!-- ========================================== -->
  <!-- Rotating Outer Ring -->
  <circle cx="150" cy="200" r="88" fill="none" stroke="#00FFCC" stroke-width="3" stroke-dasharray="15 15" style="transform-origin: 150px 200px; animation: dpSpin 15s linear infinite;"/>
  <!-- Inner Background & Profile Picture -->
  <circle cx="150" cy="200" r="80" fill="#111" />
  <image href="https://github.com/sajithaheshan.png" x="70" y="120" width="160" height="160" clip-path="url(#dpClip)" />

  <!-- ========================================== -->
  <!-- MIDDLE: NAME, RICH TEXT & QUOTE            -->
  <!-- ========================================== -->
  <g transform="translate(280, 160)">
    <!-- Name -->
    <text x="0" y="0" class="name">Sajitha Heshan</text>
    
    <!-- Rich Text / Roles -->
    <text x="0" y="35" class="role">AI-ASSISTED DEVELOPER <tspan fill="#FFFFFF" font-weight="300">|</tspan> UI/UX VISIONARY</text>
    
    <!-- Vertical Highlight Line -->
    <rect x="0" y="65" width="4" height="45" rx="2" fill="#00FFCC" />
    
    <!-- Quote -->
    <text x="18" y="80" class="quote">"I don't just talk about technology on YouTube;</text>
    <text x="18" y="105" class="quote">I use AI and design to actually build it." 🚀</text>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT: UI CARDS (YOUTUBE & LINKEDIN)       -->
  <!-- ========================================== -->
  <g transform="translate(820, 115)">
    
    <!-- YouTube Card -->
    <g style="animation: cardFloat1 5s infinite ease-in-out;">
      <rect x="0" y="0" width="320" height="75" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" style="backdrop-filter: blur(10px);"/>
      
      <!-- YouTube Icon (Original Vector) -->
      <g transform="translate(20, 20) scale(1.5)">
        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" fill="#FF0000"/>
      </g>
      
      <text x="75" y="32" class="card-title">Subscribe to Tech Channel</text>
      <text x="75" y="55" class="card-sub">Watch my latest tutorials</text>
    </g>

    <!-- LinkedIn Card -->
    <g transform="translate(0, 95)" style="animation: cardFloat2 6s infinite ease-in-out reverse;">
      <rect x="0" y="0" width="320" height="75" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" style="backdrop-filter: blur(10px);"/>
      
      <!-- LinkedIn Icon (Original Vector) -->
      <g transform="translate(20, 18) scale(1.6)">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.844-3.037-1.846 0-2.128 1.442-2.128 2.939v5.667H9.366V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zM3.56 20.452h3.555V9H3.56v11.452z" fill="#0A66C2"/>
      </g>
      
      <text x="75" y="32" class="card-title">Connect on LinkedIn</text>
      <text x="75" y="55" class="card-sub">Let's build the network</text>
    </g>

  </g>
</svg>
