<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <style>
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #FFFFFF; }
    .card-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 400; fill: #94A3B8; line-height: 1.5; }
    .tag { font-family: monospace; font-size: 13px; font-weight: bold; fill: #00FFCC; letter-spacing: 2px; }
    
    @keyframes float1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes float2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
  </style>

  <defs>
    <!-- Matching Hero Gradients -->
    <radialGradient id="glowCyan" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPink" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>
    
    <!-- Dot Grid -->
    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="#334155" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="#09090B" rx="20"/>
  <rect width="1200" height="400" fill="url(#dotGrid)" rx="20"/>
  <rect width="1200" height="400" fill="url(#glowCyan)" rx="20"/>
  <rect width="1200" height="400" fill="url(#glowPink)" rx="20"/>

  <!-- ========================================== -->
  <!-- CARD 1: YOUTUBE BROADCASTS (LEFT)          -->
  <!-- ========================================== -->
  <g transform="translate(40, 40)" style="animation: float1 6s infinite ease-in-out;">
    <rect width="640" height="320" rx="24" fill="#18181B" stroke="#27272A" stroke-width="2"/>
    <rect width="640" height="320" rx="24" fill="rgba(255,255,255,0.02)"/>
    
    <g transform="translate(40, 40)">
      <text x="0" y="20" class="tag" fill="#FF0055">CREATOR STUDIO</text>
      <text x="0" y="65" class="card-title">Subscribe to my YouTube Channel</text>
      <text x="0" y="100" class="card-sub">I break down complex AI-driven workflows, modern UI/UX</text>
      <text x="0" y="125" class="card-sub">designs, and document my journey to becoming a Full-Stack</text>
      <text x="0" y="150" class="card-sub">Developer. Join the community!</text>
    </g>

    <!-- Animated Play Button / Video Placeholder -->
    <g transform="translate(400, 150)">
      <circle cx="90" cy="50" r="70" fill="#FF0000" opacity="0.1" style="animation: pulse 2s infinite;"/>
      <circle cx="90" cy="50" r="45" fill="#FF0000"/>
      <!-- YouTube Logo Path -->
      <path d="M75 35 L110 50 L75 65 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- CARD 2: LINKEDIN NETWORK (TOP RIGHT)       -->
  <!-- ========================================== -->
  <g transform="translate(710, 40)" style="animation: float2 5s infinite ease-in-out alternate;">
    <rect width="450" height="150" rx="20" fill="#18181B" stroke="#27272A" stroke-width="2"/>
    
    <g transform="translate(30, 30)">
      <!-- LinkedIn Icon -->
      <rect x="0" y="0" width="45" height="45" rx="10" fill="#0A66C2"/>
      <path d="M12 15h4v15h-4zM14 13c-1.3 0-2.3-1-2.3-2.3S12.7 8.3 14 8.3c1.3 0 2.3 1 2.3 2.3S15.3 13 14 13zm4.5 2h3.8v2.1h.1c.5-.9 1.7-1.9 3.5-1.9 3.8 0 4.5 2.5 4.5 5.7v9.1h-4v-8.1c0-1.9 0-4.4-2.7-4.4-2.7 0-3.1 2.1-3.1 4.3v8.2h-4v-15z" fill="#FFFFFF" transform="scale(1.2) translate(1.5, 0)"/>
      
      <text x="65" y="15" class="tag" fill="#0A66C2">PROFESSIONAL NETWORK</text>
      <text x="65" y="45" class="card-title" font-size="20px">Let's Connect on LinkedIn</text>
      <text x="65" y="70" class="card-sub" font-size="14px">Open for collaborations and tech chats.</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- CARD 3: X / TWITTER UPDATES (BOTTOM RIGHT) -->
  <!-- ========================================== -->
  <g transform="translate(710, 210)" style="animation: float1 7s infinite ease-in-out reverse;">
    <rect width="450" height="150" rx="20" fill="#18181B" stroke="#27272A" stroke-width="2"/>
    
    <g transform="translate(30, 30)">
      <!-- X / Twitter Icon -->
      <rect x="0" y="0" width="45" height="45" rx="10" fill="#000000" stroke="#333" stroke-width="1"/>
      <path d="M 12 12 L 20 22 L 30 12 M 15 32 L 32 12 M 12 12 L 32 32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      
      <text x="65" y="15" class="tag" fill="#FFFFFF">QUICK THOUGHTS</text>
      <text x="65" y="45" class="card-title" font-size="20px">Follow me on X</text>
      <text x="65" y="70" class="card-sub" font-size="14px">Daily updates, resources, and UI concepts.</text>
    </g>
  </g>

</svg>
