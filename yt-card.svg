<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 400; fill: #94A3B8; }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }
      @keyframes borderGlow { 0%, 100% { stroke: #27272A; } 50% { stroke: #EF4444; } }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="400" height="180" rx="16" fill="#09090B" stroke="#27272A" stroke-width="2" style="animation: borderGlow 4s infinite ease-in-out;"/>
  
  <!-- Red Ambient Glow -->
  <circle cx="200" cy="90" r="100" fill="#EF4444" opacity="0.1" filter="blur(20px)"/>

  <!-- Icon Box -->
  <g transform="translate(30, 25)">
    <rect width="48" height="48" rx="14" fill="#EF4444" fill-opacity="0.1" stroke="#EF4444" stroke-width="1"/>
    <!-- YouTube Vector Path -->
    <path d="M33.6 15.6c-.2-1-.9-1.8-1.9-2C30 13.2 24 13.2 24 13.2s-6 0-7.7.4c-1 .2-1.7 1-1.9 2-.4 1.5-.4 4.8-.4 4.8s0 3.3.4 4.8c.2 1 .9 1.8 1.9 2 1.7.4 7.7.4 7.7.4s6 0 7.7-.4c1-.2 1.7-1 1.9-2 .4-1.5 .4-4.8 .4-4.8s0-3.3-.4-4.8zM20.6 23.6V16.4l6.4 3.6-6.4 3.6z" fill="#EF4444" transform="translate(-10, -5)"/>
  </g>

  <!-- Text Content -->
  <text x="30" y="105" class="title">Tech Broadcast Studio</text>
  <text x="30" y="130" class="sub">Watch my latest tutorials &amp; AI builds</text>

  <!-- Live Status Animation -->
  <circle cx="36" cy="155" r="4" fill="#EF4444" style="animation: pulse 1.5s infinite;"/>
  <text x="50" y="159" font-family="monospace" font-size="12px" fill="#EF4444" font-weight="bold" letter-spacing="1px">SUBSCRIBE NOW</text>
</svg>
