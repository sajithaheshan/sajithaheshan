<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 55px; font-weight: 900; fill: #FFFFFF; letter-spacing: -2px; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 400; fill: #94A3B8; line-height: 1.6; }
    .tag { font-family: monospace; font-size: 14px; fill: #FFD166; letter-spacing: 3px; font-weight: bold; }
    .cat-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #FFFFFF; }
    
    @keyframes float1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    @keyframes float2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(15px); } }
    @keyframes drawHighlight { 0% { stroke-dashoffset: 400; opacity: 0; } 20% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
    @keyframes slideGrid { 0% { transform: translateY(0); } 100% { transform: translateY(50px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.1); } }
  </style>

  <defs>
    <!-- Warm Neon Gradients -->
    <radialGradient id="glowYellow" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRed" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>
    
    <!-- Animated Perspective Tech Grid -->
    <pattern id="movingGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#FFD166" stroke-opacity="0.05" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- ========================================== -->
  <!-- BACKGROUND LAYER                           -->
  <!-- ========================================== -->
  <rect width="1200" height="450" fill="#09090B" rx="20"/>
  
  <!-- Animated Grid (Moves downwards infinitely) -->
  <g clip-path="url(#gridClip)">
    <clipPath id="gridClip"><rect width="1200" height="450" rx="20"/></clipPath>
    <rect width="1200" height="550" y="-50" fill="url(#movingGrid)" style="animation: slideGrid 4s linear infinite;"/>
  </g>

  <rect width="1200" height="450" fill="url(#glowYellow)" rx="20"/>
  <rect width="1200" height="450" fill="url(#glowRed)" rx="20"/>

  <!-- ========================================== -->
  <!-- LEFT: HEAVY TEXT & YELLOW HIGHLIGHT        -->
  <!-- ========================================== -->
  <g transform="translate(80, 80)">
    <text x="0" y="0" class="tag">SYSTEM_ARCHITECTURE</text>
    
    <!-- The Animated Yellow Marker Highlight -->
    <path d="M 0 65 Q 120 55 240 65" stroke="#FFD166" stroke-width="24" stroke-linecap="round" fill="none" stroke-dasharray="400" stroke-dashoffset="400" style="animation: drawHighlight 1.5s cubic-bezier(0.7, 0, 0.3, 1) forwards;"/>
    
    <text x="0" y="45" class="title">The <tspan fill="#09090B">Arsenal.</tspan></text>
    <text x="0" y="110" class="title">Built for scale.</text>
    
    <text x="0" y="170" class="subtitle">I don't just use tools; I orchestrate them. By combining</text>
    <text x="0" y="200" class="subtitle">AI logic engines with pixel-perfect design software,</text>
    <text x="0" y="230" class="subtitle">I architect solutions that bypass traditional boilerplate.</text>
    
    <!-- Graphic Circuit Line -->
    <path d="M 0 290 L 50 290 L 70 310 L 400 310" fill="none" stroke="#FFD166" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>
    <circle cx="0" cy="290" r="4" fill="#FFD166" style="animation: pulse 2s infinite;"/>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT: FLOATING 3D GLASS CARDS & ICONS     -->
  <!-- ========================================== -->
  <g transform="translate(600, 60)">
    
    <!-- CARD 1: AI & Logic (Floats Up) -->
    <g transform="translate(0, 0)" style="animation: float1 6s infinite ease-in-out;">
      <!-- Glassmorphism Base -->
      <rect width="480" height="90" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 209, 102, 0.2)" stroke-width="1.5"/>
      <text x="120" y="40" class="cat-title">AI Logic Engines</text>
      <text x="120" y="65" class="subtitle" font-size="14px">ChatGPT 4o &amp; Claude 3.5 Sonnet</text>
      
      <!-- OpenAI Logo -->
      <g transform="translate(30, 20) scale(1)">
        <rect width="50" height="50" rx="12" fill="#18181B" stroke="#333"/>
        <g transform="translate(15, 15)">
          <circle cx="10" cy="10" r="8" fill="none" stroke="#10A37F" stroke-width="2"/>
          <circle cx="10" cy="10" r="3" fill="#10A37F"/>
        </g>
      </g>
    </g>

    <!-- CARD 2: Design & Prototyping (Floats Down) -->
    <g transform="translate(50, 110)" style="animation: float2 7s infinite ease-in-out;">
      <rect width="480" height="90" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(239, 68, 68, 0.2)" stroke-width="1.5"/>
      <text x="120" y="40" class="cat-title">Visual Architecture</text>
      <text x="120" y="65" class="subtitle" font-size="14px">Figma, Canva &amp; Premiere Pro</text>
      
      <!-- Figma Logo (Original SVG Vector) -->
      <g transform="translate(30, 20) scale(1)">
        <rect width="50" height="50" rx="12" fill="#18181B" stroke="#333"/>
        <g transform="translate(15, 11) scale(0.8)">
          <path d="M16 16c4.4 0 8-3.6 8-8s-3.6-8-8-8-8 3.6-8 8 3.6 8 8 8z" fill="#F24E1E"/>
          <path d="M8 16c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8-3.6-8-8-8z" fill="#A259FF"/>
          <path d="M16 32c4.4 0 8-3.6 8-8s-3.6-8-8-8h-8v16h8z" fill="#1ABCFE"/>
          <path d="M8 32c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8v-8H8z" fill="#0ACF83"/>
          <path d="M16 0h8v16h-8V0z" fill="#FF7262"/>
        </g>
      </g>
    </g>

    <!-- CARD 3: Core Fundamentals (Floats Up) -->
    <g transform="translate(0, 220)" style="animation: float1 5s infinite ease-in-out;">
      <rect width="480" height="90" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1.5"/>
      <text x="120" y="40" class="cat-title">Core Fundamentals</text>
      <text x="120" y="65" class="subtitle" font-size="14px">JavaScript, Python, HTML5 &amp; CSS3</text>
      
      <!-- JS Logo -->
      <g transform="translate(30, 20) scale(1)">
        <rect width="50" height="50" rx="12" fill="#18181B" stroke="#333"/>
        <g transform="translate(15, 15) scale(0.7)">
          <rect width="30" height="30" fill="#F7DF1E"/>
          <path d="M22 25c-1 1-2.5 1.5-4 1.5-2.5 0-4-1-4.5-2l2.5-1.5c.5.5 1.5 1 2 1 1 0 1.5-.5 1.5-1 0-1.5-4-1.5-4-3.5 0-1.5 1.5-2.5 3.5-2.5 1.5 0 2.5.5 3.5 1.5l-2 1.5c-.5-.5-1-1-1.5-1-.5 0-1 .5-1 1 0 1.5 4 1.5 4 3.5 0 1.5-1.5 2.5-2.5 2.5zM11 26.5c-1.5 0-2.5-.5-3.5-1.5l2-1.5c.5.5 1.5 1 2 1 .5 0 1-.5 1-2V15h3v7.5c0 2.5-1.5 4-4.5 4z" fill="#000000"/>
        </g>
      </g>
    </g>

    <!-- Visual Connection Dots -->
    <circle cx="0" cy="45" r="4" fill="#FFD166" style="animation: pulse 1s infinite;"/>
    <circle cx="50" cy="155" r="4" fill="#EF4444" style="animation: pulse 1.5s infinite;"/>
    <circle cx="0" cy="265" r="4" fill="#3B82F6" style="animation: pulse 2s infinite;"/>

  </g>
</svg>
