<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 450"
     width="100%" height="100%"
     preserveAspectRatio="xMidYMid meet">

  <defs>
    <!-- Warm Glow Gradients -->
    <radialGradient id="glowYellow" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Tech Grid -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50"
            fill="none"
            stroke="#FFD166"
            stroke-width="1.5"
            stroke-opacity="0.05"/>
    </pattern>

    <!-- Rounded Clip -->
    <clipPath id="rounded">
      <rect x="0" y="0" width="1200" height="450" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="450" fill="#09090B" rx="20" ry="20"/>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="450" fill="url(#grid)" opacity="0.6"/>
    <rect width="1200" height="450" fill="url(#glowYellow)"/>
    <rect width="1200" height="450" fill="url(#glowRed)"/>
  </g>

  <!-- ========================================== -->
  <!-- LEFT SIDE TEXT                             -->
  <!-- ========================================== -->
  <g transform="translate(80,85)">
    <!-- Small tag -->
    <text x="0" y="0"
      fill="#FFD166"
      font-family="SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace"
      font-size="14"
      font-weight="700"
      letter-spacing="3">
      SYSTEM_ARCHITECTURE
    </text>

    <!-- Yellow highlight under main title -->
    <path d="M 0 72 Q 140 60 280 72"
      fill="none"
      stroke="#FFD166"
      stroke-width="22"
      stroke-linecap="round"
      opacity="0.9"/>

    <!-- Main title line 1 -->
    <text x="0" y="60"
      fill="#FFFFFF"
      font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="52"
      font-weight="900"
      letter-spacing="-2">
      The <tspan fill="#00E676">Arsenal.</tspan>
    </text>

    <!-- Main title line 2 -->
    <text x="0" y="118"
      fill="#FFFFFF"
      font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="40"
      font-weight="900"
      letter-spacing="-1">
      Built for scale.
    </text>

    <!-- Sub copy -->
    <text x="0" y="172"
      fill="#94A3B8"
      font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="18">
      I don't just use tools; I orchestrate them. By combining
    </text>
    <text x="0" y="202"
      fill="#94A3B8"
      font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="18">
      AI logic engines with pixel-perfect design software,
    </text>
    <text x="0" y="232"
      fill="#94A3B8"
      font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="18">
      I architect solutions that bypass traditional boilerplate.
    </text>

    <!-- Circuit line -->
    <path d="M 0 292 L 50 292 L 70 312 L 400 312"
      fill="none"
      stroke="#FFD166"
      stroke-width="2"
      stroke-dasharray="8 8"
      opacity="0.5"/>
    <circle cx="0" cy="292" r="4" fill="#FFD166" opacity="0.8"/>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT SIDE CARDS                           -->
  <!-- ========================================== -->
  <g transform="translate(600,70)">
    <!-- Card 1: AI Logic Engines -->
    <g transform="translate(0,0)">
      <rect width="480" height="90" rx="16"
        fill="#FFFFFF" fill-opacity="0.03"
        stroke="#FACC15" stroke-opacity="0.2"
        stroke-width="1.5"/>

      <!-- Icon -->
      <g transform="translate(30,20)">
        <rect width="50" height="50" rx="12"
          fill="#18181B" stroke="#333333" stroke-width="1"/>
        <g transform="translate(15,15)">
          <circle cx="10" cy="10" r="8"
            fill="none" stroke="#10A37F" stroke-width="2"/>
          <circle cx="10" cy="10" r="3" fill="#10A37F"/>
        </g>
      </g>

      <!-- Text -->
      <text x="120" y="40"
        fill="#FFFFFF"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="20"
        font-weight="800">
        AI Logic Engines
      </text>
      <text x="120" y="65"
        fill="#94A3B8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14">
        ChatGPT 4o &amp; Claude 3.5 Sonnet
      </text>
    </g>

    <!-- Card 2: Visual Architecture -->
    <g transform="translate(0,120)">
      <rect width="480" height="90" rx="16"
        fill="#FFFFFF" fill-opacity="0.03"
        stroke="#EF4444" stroke-opacity="0.2"
        stroke-width="1.5"/>

      <!-- Icon (Figma style) -->
      <g transform="translate(30,20)">
        <rect width="50" height="50" rx="12"
          fill="#18181B" stroke="#333333" stroke-width="1"/>
        <g transform="translate(15,11) scale(0.8)">
          <path d="M16 16c4.4 0 8-3.6 8-8s-3.6-8-8-8-8 3.6-8 8 3.6 8 8 8z" fill="#F24E1E"/>
          <path d="M8 16c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8-3.6-8-8-8z" fill="#A259FF"/>
          <path d="M16 32c4.4 0 8-3.6 8-8s-3.6-8-8-8h-8v16h8z" fill="#1ABCFE"/>
          <path d="M8 32c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8v-8H8z" fill="#0ACF83"/>
          <path d="M16 0h8v16h-8V0z" fill="#FF7262"/>
        </g>
      </g>

      <text x="120" y="40"
        fill="#FFFFFF"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="20"
        font-weight="800">
        Visual Architecture
      </text>
      <text x="120" y="65"
        fill="#94A3B8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14">
        Figma, Canva &amp; Premiere Pro
      </text>
    </g>

    <!-- Card 3: Core Fundamentals -->
    <g transform="translate(0,240)">
      <rect width="480" height="90" rx="16"
        fill="#FFFFFF" fill-opacity="0.03"
        stroke="#3B82F6" stroke-opacity="0.2"
        stroke-width="1.5"/>

      <!-- Icon (JS) -->
      <g transform="translate(30,20)">
        <rect width="50" height="50" rx="12"
          fill="#18181B" stroke="#333333" stroke-width="1"/>
        <g transform="translate(15,15) scale(0.7)">
          <rect width="30" height="30" fill="#F7DF1E"/>
          <path d="M22 25c-1 1-2.5 1.5-4 1.5-2.5 0-4-1-4.5-2l2.5-1.5c.5.5 1.5 1 2 1 1 0 1.5-.5 1.5-1 0-1.5-4-1.5-4-3.5 0-1.5 1.5-2.5 3.5-2.5 1.5 0 2.5.5 3.5 1.5l-2 1.5c-.5-.5-1-1-1.5-1-.5 0-1 .5-1 1 0 1.5 4 1.5 4 3.5 0 1.5-1.5 2.5-2.5 2.5zM11 26.5c-1.5 0-2.5-.5-3.5-1.5l2-1.5c.5.5 1.5 1 2 1 .5 0 1-.5 1-2V15h3v7.5c0 2.5-1.5 4-4.5 4z"
                fill="#000000"/>
        </g>
      </g>

      <text x="120" y="40"
        fill="#FFFFFF"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="20"
        font-weight="800">
        Core Fundamentals
      </text>
      <text x="120" y="65"
        fill="#94A3B8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14">
        JavaScript, Python, HTML5 &amp; CSS3
      </text>
    </g>

    <!-- Dots -->
    <circle cx="0" cy="45" r="4" fill="#FACC15"/>
    <circle cx="0" cy="165" r="4" fill="#EF4444"/>
    <circle cx="0" cy="285" r="4" fill="#3B82F6"/>
  </g>
</svg>
