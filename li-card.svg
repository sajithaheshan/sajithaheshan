<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 400; fill: #94A3B8; }
      @keyframes pulseBlue { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }
      @keyframes borderGlowBlue { 0%, 100% { stroke: #27272A; } 50% { stroke: #0A66C2; } }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="400" height="180" rx="16" fill="#09090B" stroke="#27272A" stroke-width="2" style="animation: borderGlowBlue 5s infinite ease-in-out;"/>
  
  <!-- Blue Ambient Glow -->
  <circle cx="200" cy="90" r="100" fill="#0A66C2" opacity="0.15" filter="blur(20px)"/>

  <!-- Icon Box -->
  <g transform="translate(30, 25)">
    <rect width="48" height="48" rx="14" fill="#0A66C2" fill-opacity="0.1" stroke="#0A66C2" stroke-width="1"/>
    <!-- LinkedIn Vector Path -->
    <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z" fill="#0A66C2" transform="translate(12, 12)"/>
  </g>

  <!-- Text Content -->
  <text x="30" y="105" class="title">Professional Network</text>
  <text x="30" y="130" class="sub">Let's connect &amp; build digital ecosystems</text>

  <!-- Connect Status Animation -->
  <circle cx="36" cy="155" r="4" fill="#0A66C2" style="animation: pulseBlue 1.5s infinite;"/>
  <text x="50" y="159" font-family="monospace" font-size="12px" fill="#0A66C2" font-weight="bold" letter-spacing="1px">CONNECT WITH ME</text>
</svg>
