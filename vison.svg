<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <style>
      .font-main { font-family: system-ui, -apple-system, sans-serif; }
      
      /* Rich Typography Styles */
      .bg-text { font-size: 160px; font-weight: 900; fill: none; stroke: #1E293B; stroke-width: 2px; opacity: 0.3; letter-spacing: 10px; }
      .section-tag { font-size: 14px; font-weight: bold; fill: #00FFCC; letter-spacing: 3px; font-family: monospace; }
      .main-heading { font-size: 38px; font-weight: 900; fill: #FFFFFF; letter-spacing: -1px; }
      .body-text { font-size: 16px; font-weight: 400; fill: #94A3B8; }
      .highlight-text { fill: #FFFFFF; font-weight: 700; }
      
      /* List Styles */
      .list-title { font-size: 16px; font-weight: 700; }
      .list-done { fill: #475569; text-decoration: line-through; }
      .list-active { fill: #FFFFFF; }
      .list-upcoming { fill: #64748B; }

      /* Animations */
      @keyframes slideUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      @keyframes pulseLine { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 0.5; } 90% { opacity: 0.5; } 100% { transform: translateY(400px); opacity: 0; } }
    </style>

    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00FFCC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowY" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="500" fill="#09090B" rx="20"/>
  <rect width="1200" height="500" fill="url(#dotGrid)" rx="20"/>
  <circle cx="200" cy="250" r="400" fill="url(#glowG)" />
  <circle cx="1000" cy="250" r="400" fill="url(#glowY)" />

  <!-- Animated Scanner Line -->
  <rect x="0" y="0" width="1200" height="2" fill="#00FFCC" style="animation: scan 4s linear infinite;"/>

  <!-- ========================================== -->
  <!-- MASSIVE BACKGROUND TYPOGRAPHY              -->
  <!-- ========================================== -->
  <g class="font-main" transform="translate(50, 320)">
    <text x="0" y="0" class="bg-text">MASTERPLAN</text>
  </g>

  <!-- ========================================== -->
  <!-- LEFT SIDE: THE VISION (Rich Text)          -->
  <!-- ========================================== -->
  <g class="font-main" transform="translate(80, 100)" style="animation: slideUp 1s ease-out forwards;">
    
    <text x="0" y="0" class="section-tag">01 // THE MANIFESTO</text>
    <text x="0" y="45" class="main-heading">The Ultimate <tspan fill="#00FFCC">Vision.</tspan></text>
    
    <!-- Glowing Left Border for Paragraph -->
    <rect x="0" y="70" width="3" height="230" rx="1.5" fill="#00FFCC" style="animation: pulseLine 3s infinite;"/>
    
    <!-- Multi-line SVG Text (Rich Typography) -->
    <text x="25" y="85" class="body-text">
      <tspan x="25" dy="0">I am actively transitioning from an </tspan>
      <tspan class="highlight-text">"AI-Assisted Developer"</tspan>
      <tspan x="25" dy="30">to an </tspan>
      <tspan class="highlight-text">"AI-Empowered Full-Stack Architect."</tspan>
      
      <tspan x="25" dy="45">Right now, AI generates the boilerplate, but I design the</tspan>
      <tspan x="25" dy="30">logic. My immediate goal is to generate revenue through</tspan>
      <tspan x="25" dy="30">freelance design and AI projects to fully fund a deep</tspan>
      <tspan x="25" dy="30">dive into core Software Engineering fundamentals.</tspan>
      
      <tspan x="25" dy="45">I aim to not just use AI, but to </tspan>
      <tspan class="highlight-text" fill="#FCD34D">understand and rebuild</tspan>
      <tspan x="25" dy="30">the complex systems it creates.</tspan>
    </text>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT SIDE: THE ROADMAP / CHECKLIST        -->
  <!-- ========================================== -->
  <g class="font-main" transform="translate(620, 100)" style="animation: slideUp 1s ease-out 0.3s forwards; opacity: 0;">
    
    <text x="0" y="0" class="section-tag" fill="#FCD34D">02 // MISSION CONTROL</text>
    <text x="0" y="45" class="main-heading">Current <tspan fill="#FCD34D">Objectives.</tspan></text>

    <!-- Objective 1: Completed -->
    <g transform="translate(0, 90)">
      <rect width="500" height="55" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <!-- Check Icon SVG -->
      <path d="M25 28 l-6-6 2-2 4 4 8-8 2 2 z" fill="#10B981"/>
      <circle cx="20" cy="27" r="12" fill="none" stroke="#10B981" stroke-width="2"/>
      <text x="45" y="33" class="list-title list-done">Master UI/UX Prototyping (Figma &amp; Design)</text>
    </g>

    <!-- Objective 2: In Progress (Animated) -->
    <g transform="translate(0, 160)">
      <rect width="500" height="55" rx="10" fill="#111827" stroke="#FCD34D" stroke-width="1"/>
      <!-- Spinner Icon SVG (Animated) -->
      <g transform="translate(20, 27)">
        <circle cx="0" cy="0" r="10" fill="none" stroke="#334155" stroke-width="3"/>
        <path d="M 0 -10 A 10 10 0 0 1 10 0" fill="none" stroke="#FCD34D" stroke-width="3" stroke-linecap="round" style="animation: spin 1s linear infinite; transform-origin: 0px 0px;"/>
      </g>
      <text x="45" y="33" class="list-title list-active">Establish Freelance Income via AI Solutions</text>
    </g>

    <!-- Objective 3: In Progress (Animated) -->
    <g transform="translate(0, 230)">
      <rect width="500" height="55" rx="10" fill="#111827" stroke="#FCD34D" stroke-width="1"/>
      <g transform="translate(20, 27)">
        <circle cx="0" cy="0" r="10" fill="none" stroke="#334155" stroke-width="3"/>
        <path d="M 0 -10 A 10 10 0 0 1 10 0" fill="none" stroke="#FCD34D" stroke-width="3" stroke-linecap="round" style="animation: spin 1s linear infinite; transform-origin: 0px 0px;"/>
      </g>
      <text x="45" y="33" class="list-title list-active">Reverse Engineer AI Code (Learn Core JS)</text>
    </g>

    <!-- Objective 4: Upcoming -->
    <g transform="translate(0, 300)">
      <rect width="500" height="55" rx="10" fill="#020617" stroke="#1E293B" stroke-width="1"/>
      <!-- Empty Circle SVG -->
      <circle cx="20" cy="27" r="10" fill="none" stroke="#475569" stroke-width="2"/>
      <text x="45" y="33" class="list-title list-upcoming">Deep Dive into Backend Architecture &amp; DBs</text>
    </g>

  </g>
</svg>
